name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Seed the static build database
        run: npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts
        env:
          DATABASE_URL: file:./dev.db

      - name: Export the site
        run: bash scripts/build-pages.sh
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: https://d2djob.com
          DATABASE_URL: file:./dev.db
          ADMIN_PASSWORD: pages-build-unused
          ADMIN_SESSION_SECRET: pages-build-unused-secret

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
